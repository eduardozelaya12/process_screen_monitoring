# ============================================================
# EXEMPLO: Configuração de Filtros para PeopleSoft Collector
# ============================================================

systems:
  - name: "PeopleSoft - Processos"
    type: "peoplesoft"
    base_url: "http://pswebt1.ajover.com:8080/psp/erptest/EMPLOYEE/ERP/"
    process_monitor_url: "http://pswebt1.ajover.com:8080/psc/erptest/EMPLOYEE/ERP/c/PROCESSMONITOR.PROCESSMONITOR.GBL"
    
    # ✅ NOVA SEÇÃO: Filtros para aplicar antes de capturar
    filters:
      # User ID - busca via modal
      user_id: "AJPEOPLE"  # ou null para limpar
      
      # Process Name - busca via modal
      process_name: null  # null = não filtrar
      
      # Server - dropdown
      server: "PSUNX"  # ou null
      
      # Run Status - dropdown
      # Valores: 1=Cancel, 3=Error, 7=Processing, 8=Cancelled, 9=Success, etc.
      run_status: "9"  # Apenas sucessos
      
      # Type - dropdown
      # Valores: "Application Engine", "PSJob", "SQR Report", "Crystal", etc.
      type: null
      
      # Distribution Status - dropdown
      # Valores: 2=Processing, 3=Generated, 4=Not Posted, 5=Posted, 9=Pending
      dist_status: null
      
      # Instance Range - campos de texto
      instance_from: null  # ex: "7997100"
      instance_to: null    # ex: "7997200"
      
      # Time Filter - 3 campos
      time_filter:
        type: "0"   # 0=Last, 1=Date Range
        value: "70" # Número (ex: 70 dias)
        unit: "1"   # 0=All, 1=Days, 2=Hours, 3=Minutes, 4=Years
    
    credentials:
      username: "seu_usuario"
      password: "sua_senha"
    
    timeout: 30

# ============================================================
# ALTERNATIVA 1: Filtrar apenas erros das últimas 24h
# ============================================================

  - name: "PeopleSoft - Erros 24h"
    type: "peoplesoft"
    base_url: "http://pswebt1.ajover.com:8080/psp/erptest/EMPLOYEE/ERP/"
    process_monitor_url: "http://pswebt1.ajover.com:8080/psc/erptest/EMPLOYEE/ERP/c/PROCESSMONITOR.PROCESSMONITOR.GBL"
    
    filters:
      run_status: "3"  # Apenas erros
      time_filter:
        type: "0"
        value: "24"
        unit: "2"  # Horas

# ============================================================
# ALTERNATIVA 2: Processos específicos de um usuário
# ============================================================

  - name: "PeopleSoft - User MBENITEZ"
    type: "peoplesoft"
    base_url: "http://pswebt1.ajover.com:8080/psp/erptest/EMPLOYEE/ERP/"
    process_monitor_url: "http://pswebt1.ajover.com:8080/psc/erptest/EMPLOYEE/ERP/c/PROCESSMONITOR.PROCESSMONITOR.GBL"
    
    filters:
      user_id: "MBENITEZ"
      server: "AJNODE4B"
      time_filter:
        type: "0"
        value: "7"
        unit: "1"  # Últimos 7 dias

# ============================================================
# ALTERNATIVA 3: Sem filtros (todos os processos)
# ============================================================

  - name: "PeopleSoft - Todos"
    type: "peoplesoft"
    base_url: "http://pswebt1.ajover.com:8080/psp/erptest/EMPLOYEE/ERP/"
    process_monitor_url: "http://pswebt1.ajover.com:8080/psc/erptest/EMPLOYEE/ERP/c/PROCESSMONITOR.PROCESSMONITOR.GBL"
    
    # Sem seção filters = não aplica filtros
    # OU
    filters: {}  # Objeto vazio = não aplica filtros
