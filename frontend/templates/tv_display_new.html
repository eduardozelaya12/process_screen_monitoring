<!DOCTYPE html>
<html lang="pt-br">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Monitor TV - Carrossel</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			background: #0a0e1a;
			color: #e0e0e0;
			font-family: system-ui, -apple-system, sans-serif;
			height: 100vh;
			display: flex;
			flex-direction: column;
			overflow: hidden;
		}

		.header {
			background: #141824;
			padding: 16px 24px;
			border-bottom: 2px solid #1e293b;
			display: flex;
			justify-content: space-between;
			align-items: center;
			height: 70px;
			flex-shrink: 0;
		}

		.header h1 {
			font-size: 24px;
			font-weight: 600;
			color: #fff;
		}

		.clock {
			font-size: 20px;
			color: #10b981;
			font-weight: 600;
		}

		/* Container principal que centraliza o card */
		.main-container {
			flex: 1;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
			position: relative;
		}

		.system-card {
			background: #141824;
			border-radius: 12px;
			padding: 20px;
			border: 2px solid #1e293b;
			width: 100%;
			max-width: 1400px;
			/* Limite largura em telas ultra-wide */
			height: 100%;
			display: flex;
			flex-direction: column;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
			animation: fadeIn 0.5s ease-out;
		}

		@keyframes fadeIn {
			from {
				opacity: 0;
				transform: translateY(10px);
			}

			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.system-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 16px;
			flex-shrink: 0;
		}

		.system-name {
			font-size: 28px;
			font-weight: 700;
			color: #fff;
		}

		.status-badge {
			padding: 6px 16px;
			border-radius: 8px;
			font-size: 14px;
			font-weight: 600;
		}

		.status-active {
			background: #10b981;
			color: #fff;
		}

		.status-inactive {
			background: #6b7280;
			color: #fff;
		}

		.content-area {
			flex: 1;
			background: #000;
			border-radius: 8px;
			overflow: hidden;
			border: 1px solid #1f2937;
			position: relative;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.content-area img {
			max-width: 100%;
			max-height: 100%;
			object-fit: contain;
			display: block;
		}

		.no-content {
			color: #6b7280;
			font-size: 18px;
			text-align: center;
		}

		.footer {
			margin-top: 16px;
			display: flex;
			justify-content: space-between;
			color: #94a3b8;
			font-size: 14px;
			flex-shrink: 0;
		}

		.progress-bar-container {
			position: absolute;
			bottom: 0;
			left: 0;
			width: 100%;
			height: 4px;
			background: #1e293b;
		}

		.progress-bar {
			height: 100%;
			background: #3b82f6;
			width: 0%;
			transition: width linear;
		}

		/* Estilos específicos para tabela de banco de dados */
		table.db-table {
			width: 100%;
			border-collapse: collapse;
			font-size: 14px;
			color: #e0e0e0;
		}

		table.db-table th {
			text-align: left;
			background: #1e293b;
			padding: 12px;
			border-bottom: 2px solid #334155;
			position: sticky;
			top: 0;
		}

		table.db-table td {
			padding: 10px 12px;
			border-bottom: 1px solid #1f2937;
		}

		table.db-table tr:nth-child(even) {
			background: #0f1320;
		}

		table.db-table tr:hover {
			background: #1e293b;
		}
	</style>
</head>

<body>
	<div class="header">
		<h1>📊 Monitor Rotativo</h1>
		<div class="clock" id="clock">--:--:--</div>
	</div>

	<div class="main-container" id="mainContainer">
		<div style="text-align:center;color:#6b7280;">
			<p>Carregando sistemas...</p>
		</div>
	</div>

	<div class="progress-bar-container">
		<div class="progress-bar" id="progressBar"></div>
	</div>

	<script src="/socket.io/socket.io.js"></script>
	<script src="{{ url_for('static', filename='js/websocket.js') }}"></script>
	<script>
		// Configuração
		const ROTATION_INTERVAL = 10000; // 10 segundos por sistema

		// Estado
		let systemsMap = {};
		let enabledSystemKeys = [];
		let currentIndex = 0;
		let rotationTimer = null;
		let progressInterval = null;
		let wsClient = null;
		let nextRotationTime = 0;

		// Clock
		function updateClock() {
			const now = new Date();
			document.getElementById('clock').textContent = now.toLocaleTimeString('pt-BR');
		}
		setInterval(updateClock, 1000);
		updateClock();

		// Função principal de carga
		async function loadSystems() {
			try {
				const response = await fetch('/api/systems/all', { cache: 'no-store' });
				if (!response.ok) throw new Error();

				const data = await response.json();
				systemsMap = data;

				// Filtrar apenas os habilitados e ordenar (opcional: por nome)
				const newEnabledKeys = Object.keys(systemsMap)
					.filter(k => systemsMap[k].enabled)
					.sort((a, b) => systemsMap[a].name.localeCompare(systemsMap[b].name));

				// Se a lista mudou significativamente, resetar ou ajustar
				// Para simplificar, se não tínhamos nada, começamos
				if (enabledSystemKeys.length === 0 && newEnabledKeys.length > 0) {
					enabledSystemKeys = newEnabledKeys;
					startCarousel();
				} else {
					// Apenas atualiza a lista para a próxima rotação pegar novos/remover antigos
					enabledSystemKeys = newEnabledKeys;
				}

			} catch (error) {
				console.error('Erro ao carregar sistemas:', error);
			}
		}

		function startCarousel() {
			if (enabledSystemKeys.length === 0) {
				renderEmpty();
				return;
			}

			// Renderiza o primeiro imediatamente
			renderCurrentSystem();

			// Configura o loop
			scheduleNextRotation();
		}

		function scheduleNextRotation() {
			if (rotationTimer) clearTimeout(rotationTimer);
			if (progressInterval) clearInterval(progressInterval);

			const now = Date.now();
			nextRotationTime = now + ROTATION_INTERVAL;

			// Timer para trocar o sistema
			rotationTimer = setTimeout(() => {
				currentIndex = (currentIndex + 1) % enabledSystemKeys.length;
				renderCurrentSystem();
				scheduleNextRotation();
			}, ROTATION_INTERVAL);

			// Animação da barra de progresso
			const bar = document.getElementById('progressBar');
			progressInterval = setInterval(() => {
				const timeLeft = nextRotationTime - Date.now();
				const percentage = Math.max(0, (timeLeft / ROTATION_INTERVAL) * 100);
				bar.style.width = (100 - percentage) + '%';

				if (timeLeft <= 0) clearInterval(progressInterval);
			}, 50); // 20fps
		}

		async function renderCurrentSystem() {
			const container = document.getElementById('mainContainer');

			if (enabledSystemKeys.length === 0) {
				renderEmpty();
				return;
			}

			// Se o índice ficou inválido (ex: sistema removido), reseta
			if (currentIndex >= enabledSystemKeys.length) currentIndex = 0;

			const key = enabledSystemKeys[currentIndex];
			const system = systemsMap[key];

			if (!system) return; // Segurança

			const isDatabase = (system.type || '').toLowerCase() === 'database';
			const statusClass = system.running ? 'status-active' : 'status-inactive';
			const statusText = system.running ? 'Ativo' : 'Parado';

			// Estrutura Base do Card
			container.innerHTML = `
				<div class="system-card">
					<div class="system-header">
						<div class="system-name">${system.name}</div>
						<div class="status-badge ${statusClass}">
							${statusText}
						</div>
					</div>
					
					<div class="content-area" id="content-${key}">
						<div class="no-content">Carregando dados...</div>
					</div>
					
					<div class="footer">
						<div>Intervalo de Coleta: ${system.interval || system.collection_interval}s</div>
						<div id="footer-update-${key}">--</div>
					</div>
				</div>
			`;

			// Carregar Conteúdo Específico
			if (system.running) {
				if (isDatabase) {
					await loadDatabaseContent(key);
				} else {
					await loadScreenshotContent(key);
				}
			} else {
				document.getElementById(`content-${key}`).innerHTML = `
					<div class="no-content">
						Sistema pausado ou desligado.
					</div>
				`;
			}
		}

		function renderEmpty() {
			const container = document.getElementById('mainContainer');
			container.innerHTML = `
				<div style="text-align:center;color:#6b7280;font-size:20px;">
					<p>Nenhum sistema habilitado para exibição.</p>
				</div>
			`;
		}

		// --- Carregadores de Conteúdo ---

		async function loadScreenshotContent(key) {
			const contentEl = document.getElementById(`content-${key}`);
			const footerEl = document.getElementById(`footer-update-${key}`);

			try {
				const r = await fetch(`/api/screenshot/${key}`, { cache: 'no-store' });
				if (!r.ok) throw new Error('No Data');
				const data = await r.json();

				if (data && data.path) {
					contentEl.innerHTML = `<img src="${data.path}?t=${Date.now()}" alt="Screenshot">`;
					if (footerEl) footerEl.textContent = `Atualizado: ${new Date().toLocaleTimeString()}`;
				} else {
					throw new Error('Sem imagem');
				}
			} catch (e) {
				contentEl.innerHTML = `<div class="no-content">Imagem não disponível.</div>`;
			}
		}

		async function loadDatabaseContent(key) {
			const contentEl = document.getElementById(`content-${key}`);
			const footerEl = document.getElementById(`footer-update-${key}`);

			try {
				const r = await fetch(`/api/status/${key}`, { cache: 'no-store' });
				if (!r.ok) throw new Error('No Data');
				const data = await r.json();
				const results = data.query_results || data.data?.query_results || [];

				if (results.length === 0) {
					contentEl.innerHTML = `<div class="no-content">Consulta retornou 0 registros.</div>`;
				} else {
					// Renderizar Tabela
					if (footerEl) footerEl.textContent = `Atualizado: ${new Date().toLocaleTimeString()}`;

					// Criar tabela dinâmica
					// Pegar colunas do primeiro registro
					const cols = Object.keys(results[0]);

					let html = `<div style="width:100%;height:100%;overflow:auto;"><table class="db-table"><thead><tr>`;
					cols.forEach(c => html += `<th>${c}</th>`);
					html += `</tr></thead><tbody>`;

					results.forEach(row => {
						html += `<tr>`;
						cols.forEach(c => html += `<td>${row[c] !== null ? row[c] : ''}</td>`);
						html += `</tr>`;
					});

					html += `</tbody></table></div>`;
					contentEl.innerHTML = html;
				}

			} catch (e) {
				contentEl.innerHTML = `<div class="no-content">Erro ao carregar dados do banco.</div>`;
			}
		}

		// Websocket para atualizações em tempo real (opcional para forçar refresh se estiver na tela)
		function initWebSocket() {
			try {
				wsClient = new WebSocketClient();
				wsClient.on('update', (data) => {
					// Se o sistema atual recebeu update, recarrega o conteúdo
					if (enabledSystemKeys[currentIndex] === data.system) {
						// Verifica tipo e recarrega
						const sys = systemsMap[data.system];
						if (sys) {
							const isDatabase = (sys.type || '').toLowerCase() === 'database';
							if (isDatabase) loadDatabaseContent(data.system);
							else loadScreenshotContent(data.system);
						}
					}
				});
				wsClient.connect();
			} catch (e) { console.error(e); }
		}

		// Iniciar
		loadSystems();
		initWebSocket();

		// Verificar novos sistemas periodicamente
		setInterval(loadSystems, 15000);

	</script>
</body>

</html>
