<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Monitor TV - Todos os Sistemas</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body {
			background: #0a0e1a;
			color: #e0e0e0;
			font-family: system-ui, -apple-system, sans-serif;
			overflow: hidden;
		}
		.header {
			background: #141824;
			padding: 16px 24px;
			border-bottom: 2px solid #1e293b;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}
		.header h1 {
			font-size: 24px;
			font-weight: 600;
			color: #fff;
		}
		.clock {
			font-size: 20px;
			color: #10b981;
			font-weight: 600;
		}
		.grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
			gap: 20px;
			padding: 20px;
			height: calc(100vh - 70px);
			overflow-y: auto;
		}
		.system-card {
			background: #141824;
			border-radius: 12px;
			padding: 16px;
			border: 2px solid #1e293b;
			transition: all 0.3s;
		}
		.system-card:hover {
			border-color: #3b82f6;
			transform: translateY(-2px);
		}
		.system-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 12px;
		}
		.system-name {
			font-size: 18px;
			font-weight: 600;
			color: #fff;
		}
		.status {
			padding: 4px 12px;
			border-radius: 6px;
			font-size: 12px;
			font-weight: 600;
		}
		.status-active {
			background: #10b981;
			color: #fff;
		}
		.status-inactive {
			background: #6b7280;
			color: #fff;
		}
		.status-error {
			background: #ef4444;
			color: #fff;
		}
		.screenshot-container {
			position: relative;
			background: #000;
			border-radius: 8px;
			overflow: hidden;
			aspect-ratio: 16/9;
		}
		.screenshot-container img {
			width: 100%;
			height: 100%;
			object-fit: contain;
			display: block;
		}
		.no-screenshot {
			display: flex;
			align-items: center;
			justify-content: center;
			height: 100%;
			color: #6b7280;
			font-size: 14px;
		}
		.system-info {
			margin-top: 8px;
			font-size: 12px;
			color: #9ca3af;
			display: flex;
			justify-content: space-between;
		}
		.loading {
			display: inline-block;
			width: 12px;
			height: 12px;
			border: 2px solid #3b82f6;
			border-top-color: transparent;
			border-radius: 50%;
			animation: spin 0.8s linear infinite;
		}
		@keyframes spin {
			to { transform: rotate(360deg); }
		}
		.pulse {
			animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
		}
		@keyframes pulse {
			0%, 100% { opacity: 1; }
			50% { opacity: .5; }
		}
	</style>
</head>
<body>
	<div class="header">
		<h1>📊 Monitor de Processos - TV</h1>
		<div class="clock" id="clock">--:--:--</div>
	</div>

	<div class="grid" id="systemsGrid">
		<div style="text-align:center;color:#6b7280;padding:40px;">
			<div class="loading"></div>
			<p style="margin-top:12px;">Carregando sistemas...</p>
		</div>
	</div>

	<script>
		let systems = {};
		let updateInterval = null;

		// Atualizar relógio
		function updateClock() {
			const now = new Date();
			document.getElementById('clock').textContent = now.toLocaleTimeString('pt-BR');
		}
		setInterval(updateClock, 1000);
		updateClock();

		// Carregar e atualizar sistemas
		async function loadSystems() {
			try {
				const response = await fetch('/api/systems/all', { cache: 'no-store' });
				if (!response.ok) throw new Error();
				
				const data = await response.json();
				systems = data;
				
				renderSystems();
			} catch (error) {
				console.error('Erro ao carregar sistemas:', error);
			}
		}

		function renderSystems() {
			const grid = document.getElementById('systemsGrid');
			grid.innerHTML = '';

			for (const [key, system] of Object.entries(systems)) {
				const card = createSystemCard(key, system);
				grid.appendChild(card);
			}
		}

		function createSystemCard(key, system) {
			const card = document.createElement('div');
			card.className = 'system-card';
			card.id = `system-${key}`;

			const statusClass = system.running ? 'status-active' : 'status-inactive';
			const statusText = system.running ? '● Ativo' : '○ Parado';

			card.innerHTML = `
				<div class="system-header">
					<div class="system-name">${system.name}</div>
					<div class="status ${statusClass}">${statusText}</div>
				</div>
				<div class="screenshot-container" id="screenshot-${key}">
					<div class="no-screenshot">Aguardando screenshot...</div>
				</div>
				<div class="system-info">
					<span>Intervalo: ${system.interval}s</span>
					<span id="lastupdate-${key}">--</span>
				</div>
			`;

			// Carregar screenshot
			if (system.running) {
				loadScreenshot(key);
			}

			return card;
		}

		async function loadScreenshot(systemKey) {
			try {
				const response = await fetch(`/api/screenshot/${systemKey}`, { cache: 'no-store' });
				if (!response.ok) throw new Error();
				
				const data = await response.json();
				const container = document.getElementById(`screenshot-${systemKey}`);
				
				if (container) {
					container.innerHTML = `<img src="${data.path}?t=${Date.now()}" alt="${systemKey}">`;
					
					const lastUpdate = document.getElementById(`lastupdate-${systemKey}`);
					if (lastUpdate) {
						lastUpdate.textContent = `Atualizado: ${new Date().toLocaleTimeString('pt-BR')}`;
					}
				}
			} catch (error) {
				console.error(`Erro ao carregar screenshot de ${systemKey}:`, error);
			}
		}

		function updateAllScreenshots() {
			for (const [key, system] of Object.entries(systems)) {
				if (system.running) {
					loadScreenshot(key);
				}
			}
		}

		// Inicialização
		loadSystems();
		
		// Atualizar lista de sistemas a cada 10 segundos
		setInterval(loadSystems, 10000);
		
		// Atualizar screenshots a cada 15 segundos
		setInterval(updateAllScreenshots, 15000);
	</script>
</body>
</html>
