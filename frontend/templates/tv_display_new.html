<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Monitor TV - Todos os Sistemas</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body {
			background: #0a0e1a;
			color: #e0e0e0;
			font-family: system-ui, -apple-system, sans-serif;
			overflow: hidden;
		}
		.header {
			background: #141824;
			padding: 16px 24px;
			border-bottom: 2px solid #1e293b;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}
		.header h1 {
			font-size: 24px;
			font-weight: 600;
			color: #fff;
		}
		.clock {
			font-size: 20px;
			color: #10b981;
			font-weight: 600;
		}
		.grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
			gap: 20px;
			padding: 20px;
			height: calc(100vh - 70px);
			overflow-y: auto;
		}
		.system-card {
			background: #141824;
			border-radius: 12px;
			padding: 16px 16px 12px;
			border: 2px solid #1e293b;
			transition: all 0.3s;
		}
		.system-card:hover {
			border-color: #3b82f6;
			transform: translateY(-2px);
		}
		.system-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 12px;
		}
		.system-name {
			font-size: 18px;
			font-weight: 600;
			color: #fff;
		}
		.status {
			padding: 4px 12px;
			border-radius: 6px;
			font-size: 12px;
			font-weight: 600;
		}
		.status-active {
			background: #10b981;
			color: #fff;
		}
		.status-inactive {
			background: #6b7280;
			color: #fff;
		}
		.status-error {
			background: #ef4444;
			color: #fff;
		}
		.screenshot-container {
			position: relative;
			background: #000;
			border-radius: 8px;
			overflow: auto;
			max-height: 70vh;
			border: 1px solid #1f2937;
		}
		.screenshot-container img {
			max-width: 100%;
			height: auto;
			display: block;
		}
		.no-screenshot {
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 220px;
			color: #6b7280;
			font-size: 14px;
		}
		.system-info {
			margin-top: 8px;
			font-size: 12px;
			color: #9ca3af;
			display: flex;
			justify-content: space-between;
		}
		.system-card footer {
			display: flex;
			justify-content: space-between;
			font-size: 12px;
			color: #94a3b8;
			margin-top: 6px;
		}
		.countdown-timer {
			font-size: 13px;
			font-weight: 600;
			color: #10b981;
			margin-top: 4px;
		}
		.countdown-timer.warning {
			color: #f59e0b;
		}
		.countdown-timer.critical {
			color: #ef4444;
		}
		.loading {
			display: inline-block;
			width: 12px;
			height: 12px;
			border: 2px solid #3b82f6;
			border-top-color: transparent;
			border-radius: 50%;
			animation: spin 0.8s linear infinite;
		}
		@keyframes spin {
			to { transform: rotate(360deg); }
		}
		.pulse {
			animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
		}
		@keyframes pulse {
			0%, 100% { opacity: 1; }
			50% { opacity: .5; }
		}
	</style>
</head>
<body>
	<div class="header">
		<h1>📊 Monitor de Processos - TV</h1>
		<div class="clock" id="clock">--:--:--</div>
	</div>

	<div class="grid" id="systemsGrid">
		<div style="text-align:center;color:#6b7280;padding:40px;">
			<div class="loading"></div>
			<p style="margin-top:12px;">Carregando sistemas...</p>
		</div>
	</div>

	<script src="/socket.io/socket.io.js"></script>
	<script src="{{ url_for('static', filename='js/websocket.js') }}"></script>
	<script>
		let systems = {};
		let updateInterval = null;
		let wsClient = null;
		let countdownTimers = {}; // Armazena timers de contagem regressiva por sistema

		// Atualizar relógio
		function updateClock() {
			const now = new Date();
			document.getElementById('clock').textContent = now.toLocaleTimeString('pt-BR');
		}
		setInterval(updateClock, 1000);
		updateClock();

		// Carregar e atualizar sistemas
		async function loadSystems() {
			try {
				const response = await fetch('/api/systems/all', { cache: 'no-store' });
				if (!response.ok) throw new Error();
				
				const data = await response.json();
				const enabledEntries = Object.entries(data).filter(([_, system]) => system.enabled);
				systems = Object.fromEntries(enabledEntries);
				
				renderSystems();
				updateAllScreenshots();
			} catch (error) {
				console.error('Erro ao carregar sistemas:', error);
			}
		}

		function renderSystems() {
			const grid = document.getElementById('systemsGrid');
			
			// Limpar timers de sistemas que não existem mais
			const currentSystemKeys = new Set(Object.keys(systems));
			for (const key in countdownTimers) {
				if (!currentSystemKeys.has(key)) {
					clearInterval(countdownTimers[key]);
					delete countdownTimers[key];
				}
			}

			grid.innerHTML = '';

			const entries = Object.entries(systems);

			if (entries.length === 0) {
				grid.innerHTML = `
					<div style="text-align:center;color:#6b7280;padding:40px;">
						<p>Nenhum sistema habilitado para exibição.</p>
					</div>
				`;
				return;
			}

			for (const [key, system] of entries) {
				grid.appendChild(createSystemCard(key, system));
			}
		}

		function createSystemCard(key, system) {
			const card = document.createElement('div');
			card.className = 'system-card';
			card.id = `system-${key}`;

			const statusClass = system.running ? 'status-active' : 'status-inactive';
			const statusText = system.running ? '● Ativo' : '○ Parado';
			const isDatabase = (system.type || '').toLowerCase() === 'database';

			card.innerHTML = `
				<div class="system-header">
					<div class="system-name">${system.name}</div>
					<div class="status ${statusClass}">${statusText}</div>
				</div>
				<div class="screenshot-container" id="screenshot-${key}">
					<div class="no-screenshot">
						${isDatabase ? 'Aguardando dados da consulta SQL...' : 'Aguardando screenshot...'}
					</div>
				</div>
				<footer>
					<div style="display: flex; flex-direction: column; gap: 2px;">
						<span>Intervalo: ${system.interval}s (${isDatabase ? 'Database' : 'Screenshot'})</span>
						${isDatabase ? `<span class="countdown-timer" id="countdown-${key}">--</span>` : ''}
					</div>
					<span id="lastupdate-${key}">--</span>
				</footer>
			`;

			// Carregar conteúdo inicial (screenshot ou dados da query)
			if (system.running) {
				if (isDatabase) {
					loadDatabaseData(key);
				} else {
					loadScreenshot(key);
				}
			} else {
				// Se sistema parado, limpar contador se existir
				if (isDatabase && countdownTimers[key]) {
					clearInterval(countdownTimers[key]);
					delete countdownTimers[key];
					const countdownEl = document.getElementById(`countdown-${key}`);
					if (countdownEl) {
						countdownEl.textContent = 'Sistema parado';
						countdownEl.className = 'countdown-timer';
					}
				}
			}

			return card;
		}

		async function loadScreenshot(systemKey) {
			const container = document.getElementById(`screenshot-${systemKey}`);
			const lastUpdate = document.getElementById(`lastupdate-${systemKey}`);

			try {
				const response = await fetch(`/api/screenshot/${systemKey}`, { cache: 'no-store' });
				
				if (!response.ok) {
					// Quando não houver screenshot (ex.: sistemas de banco de dados),
					// mostramos uma mensagem amigável em vez de ficar "aguardando" para sempre.
					if (container) {
						container.innerHTML = `
							<div class="no-screenshot">
								Nenhum screenshot disponível para este sistema.
							</div>
						`;
					}
					if (lastUpdate) {
						lastUpdate.textContent = `Sem screenshot (${new Date().toLocaleTimeString('pt-BR')})`;
					}
					return;
				}
				
				const data = await response.json();
				
				if (container && data && data.path) {
					container.innerHTML = `<img src="${data.path}?t=${Date.now()}" alt="${systemKey}">`;
					
					if (lastUpdate) {
						lastUpdate.textContent = `Atualizado: ${new Date().toLocaleTimeString('pt-BR')}`;
					}
				}
			} catch (error) {
				console.error(`Erro ao carregar screenshot de ${systemKey}:`, error);
				
				if (container) {
					container.innerHTML = `
						<div class="no-screenshot">
							Erro ao carregar screenshot.
						</div>
					`;
				}
				if (lastUpdate) {
					lastUpdate.textContent = `Erro ao carregar (${new Date().toLocaleTimeString('pt-BR')})`;
				}
			}
		}

		async function loadDatabaseData(systemKey) {
			const container = document.getElementById(`screenshot-${systemKey}`);
			const lastUpdate = document.getElementById(`lastupdate-${systemKey}`);

			try {
				const response = await fetch(`/api/status/${systemKey}`, { cache: 'no-store' });

				if (!response.ok) {
					if (container) {
						container.innerHTML = `
							<div class="no-screenshot">
								Não foi possível obter os dados da consulta SQL.
							</div>
						`;
					}
					if (lastUpdate) {
						lastUpdate.textContent = `Erro na consulta (${new Date().toLocaleTimeString('pt-BR')})`;
					}
					return;
				}

				const data = await response.json();
				const queryResults = data.query_results || data.data?.query_results || [];

				if (!container) return;

				if (!queryResults.length) {
					container.innerHTML = `
						<div class="no-screenshot">
							Nenhum registro retornado para a consulta informada.
						</div>
					`;
				} else {
					// Monta uma pequena tabela com os primeiros registros/colunas
					const firstRow = queryResults[0];
					const allColumns = Object.keys(firstRow);
					const columns = allColumns.slice(0, 6); // limitar colunas para caber na TV
					const rows = queryResults.slice(0, 10); // limitar linhas

					let tableHtml = '<table style="width:100%;border-collapse:collapse;font-size:11px;">';
					tableHtml += '<thead><tr>';
					for (const col of columns) {
						tableHtml += `<th style="text-align:left;border-bottom:1px solid #1f2937;padding:4px 6px;color:#9ca3af;">${col}</th>`;
					}
					tableHtml += '</tr></thead><tbody>';

					for (const row of rows) {
						tableHtml += '<tr>';
						for (const col of columns) {
							const value = row[col] != null ? row[col] : '';
							tableHtml += `<td style="padding:3px 6px;border-bottom:1px solid #111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px;">${value}</td>`;
						}
						tableHtml += '</tr>';
					}

					tableHtml += '</tbody></table>';

					container.innerHTML = tableHtml;
				}

				if (lastUpdate) {
					lastUpdate.textContent = `Atualizado: ${new Date().toLocaleTimeString('pt-BR')}`;
				}

				// Iniciar/atualizar contador regressivo se houver timestamp da última coleta
				// Pode vir em last_collection (do backend) ou timestamp (dos dados processados)
				const lastCollectionTime = data.last_collection || data.timestamp || data.processed_at;
				const collectionInterval = data.collection_interval || systems[systemKey]?.interval || 300;
				
				if (lastCollectionTime && collectionInterval) {
					updateCountdown(systemKey, lastCollectionTime, collectionInterval);
				}
			} catch (error) {
				console.error(`Erro ao carregar dados de banco para ${systemKey}:`, error);

				if (container) {
					container.innerHTML = `
						<div class="no-screenshot">
							Erro ao carregar dados da consulta SQL.
						</div>
					`;
				}
				if (lastUpdate) {
					lastUpdate.textContent = `Erro ao carregar (${new Date().toLocaleTimeString('pt-BR')})`;
				}
			}
		}

		function updateAllScreenshots() {
			for (const [key, system] of Object.entries(systems)) {
				if (!system.running) continue;

				const isDatabase = (system.type || '').toLowerCase() === 'database';
				if (isDatabase) {
					loadDatabaseData(key);
				} else {
					loadScreenshot(key);
				}
			}
		}

		function initWebSocket() {
			try {
				wsClient = new WebSocketClient();
				wsClient.on('connected', () => {
					console.log('WebSocket conectado (tv display)');
				});
				wsClient.on('update', (data) => {
					// Atualizar contador quando novos dados chegarem via WebSocket
					const systemKey = data.system;
					if (systemKey && systems[systemKey]) {
						const system = systems[systemKey];
						const isDatabase = (system.type || '').toLowerCase() === 'database';
						
						if (isDatabase && data.data) {
							// Recarregar dados do banco (que já atualiza o contador)
							loadDatabaseData(systemKey);
						}
					}
				});
				wsClient.on('config_update', () => {
					loadSystems();
				});
				wsClient.on('error', (data) => {
					console.warn('WS error:', data);
				});
				wsClient.connect();
			} catch (error) {
				console.error('Falha ao inicializar WebSocket:', error);
			}
		}

		function updateCountdown(systemKey, lastCollectionISO, intervalSeconds) {
			const countdownEl = document.getElementById(`countdown-${systemKey}`);
			if (!countdownEl) return;

			// Limpar timer anterior se existir
			if (countdownTimers[systemKey]) {
				clearInterval(countdownTimers[systemKey]);
			}

			const updateTimer = () => {
				const lastCollection = new Date(lastCollectionISO);
				const now = new Date();
				const elapsed = Math.floor((now - lastCollection) / 1000); // segundos desde última coleta
				const remaining = Math.max(0, intervalSeconds - elapsed);

				if (remaining <= 0) {
					countdownEl.textContent = 'Coletando...';
					countdownEl.className = 'countdown-timer';
					return;
				}

				const minutes = Math.floor(remaining / 60);
				const seconds = remaining % 60;
				const formatted = `${minutes}:${seconds.toString().padStart(2, '0')}`;

				countdownEl.textContent = `Próxima coleta em: ${formatted}`;

				// Mudar cor baseado no tempo restante
				if (remaining <= 10) {
					countdownEl.className = 'countdown-timer critical';
				} else if (remaining <= 30) {
					countdownEl.className = 'countdown-timer warning';
				} else {
					countdownEl.className = 'countdown-timer';
				}
			};

			// Atualizar imediatamente e depois a cada segundo
			updateTimer();
			countdownTimers[systemKey] = setInterval(updateTimer, 1000);
		}

		// Inicialização
		loadSystems();
		initWebSocket();
		
		// Atualizar lista de sistemas a cada 10 segundos
		setInterval(loadSystems, 10000);
		
		// Atualizar screenshots a cada 15 segundos
		setInterval(updateAllScreenshots, 15000);
	</script>
</body>
</html>
