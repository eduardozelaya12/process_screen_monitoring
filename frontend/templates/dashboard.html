<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Process Monitor Dashboard</title>
	<style>
		body { margin:24px; font-family:system-ui, Arial, sans-serif; background:#0f1320; color:#e6e8ef; }
		h1 { margin:0 0 12px; }
		img { max-width:720px; width:100%; border-radius:8px; box-shadow:0 6px 16px rgba(0,0,0,.5); background:#000; }
		.row { display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap; }
		.card { background:#141a2a; padding:16px; border-radius:10px; }
		.small { opacity:.8; font-size:12px; }
	</style>
</head>
<body>
	<h1>Process Monitor Dashboard</h1>
	<div class="row">
		<div class="card">
			<h3>Último Screenshot (Peoplesoft ou Fallback)</h3>
			<img id="shot" alt="Screenshot" src="" />
			<div class="small" id="timestamp">—</div>
		</div>
	</div>

	<script>
		async function update() {
			const img = document.getElementById('shot');
			const ts = document.getElementById('timestamp');
			try {
				const r = await fetch('/api/screenshot/peoplesoft', { cache: 'no-store' });
				if (!r.ok) throw new Error();
				const j = await r.json();
				img.src = j.path + `?t=${Date.now()}`;
				ts.textContent = new Date().toLocaleString();
			} catch(e) {
				img.src = '/storage/logs/google_home.png' + `?t=${Date.now()}`;
				ts.textContent = 'fallback: google_home.png';
			}
		}
		update();
		setInterval(update, 15000);
	</script>
</body>
</html>
