<head>
    <title>Sign-on no Oracle PeopleSoft</title>
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <script language="JavaScript">
        var sDomain = ".ajover.com";
        try {
            document.domain = ".ajover.com";
        }
        catch (err) { ; }
    </script>

    <script type="text/javascript">
        if (self === top) {
            var fb = document.getElementById("ptfb");
            fb.parentNode.removeChild(fb);
        } else {
            try {
                top.location = self.location;
            } catch (ex) { }
        }
    </script>
    <link type="text/css" href="/pa91test/signin.css" rel="stylesheet">
    <script type="text/javascript" src="/pa91test/signin.js"></script>

</head>

<body onload="ptSignon().login();">
    <div id="pswrapper">
        <form id="login" name="login" method="post" action="?&amp;cmd=login&amp;languageCd=POR" autocomplete="off">
            <input type="hidden" id="lcsrf_token" name="lcsrf_token"
                value="DUZlzYZBWkCzJ+p8e9SvBz/oDFJyefwcPu7fKIKjPf4=">
            <input type="hidden" id="timezoneOffset" name="timezoneOffset" value="0">
            <input type="hidden" id="ptmode" name="ptmode" value="f">
            <input type="hidden" id="ptlangcd" name="ptlangcd" value="POR">
            <input type="hidden" id="ptinstalledlang" name="ptinstalledlang" value="ENG,POR,ESP">
            <div class="signonMain">
                <h1><img src="/pa91test/images/Header.png" class="ps-staticimg" alt="Sign-on no Oracle PeopleSoft"
                        title="Sign-on no Oracle PeopleSoft"></h1>
                <div class="ps_signinentry">
                    <div id="ptloginerrorcont" class="ps_login_error">
                        <div class="ps_login_error_inner" id="ps_login_error_inner" tabindex="-1" role="heading"
                            aria-level="2">
                            <a id="error_link" name="error_link" tabindex="-1"><img
                                    src="/pa91test/images/PT_LOGIN_ERROR.gif" alt="Erro"></a>
                            <div class="psloginerror" id="discovery_error" name="discovery_error"></div>
                            <span class="psloginerror" id="login_error" name="login_error"></span>
                        </div>
                        <div class="ps_box-control psloginerror" id="browsercheck_error" name="browsercheck_error"
                            aria-live="assertive" role="alert"></div>
                    </div>

                    <div>
                        <span class="ps_label-show" id="ptLabelUserid"><label for="userid">ID Usuário</label></span>
                    </div>
                    <div class="ps_box-control">
                        <input type="text" id="userid" name="userid" value="" title="ID Usuário">
                    </div>
                    <div>
                        <span class="ps_label-show" id="ptLabelPassword"><label for="pwd">Senha</label></span>
                    </div>
                    <div class="ps_box-control">
                        <input type="password" id="pwd" name="pwd" title="Senha">
                    </div>
                    <div>
                        <span class="ps_label-show" id="ptLabelSelect"><label for="ptlangsel">Selecione um
                                Idioma</label></span>
                    </div>
                    <div id="ps_select_parent">
                        <div id="ps_select_box" class="ps_box-control">
                            <select id="ptlangsel" name="ptlangsel" title="Selecione um Idioma" class="ps_select"
                                onchange="ptSignon().changeLangFunc(this, event)">
                                <option value="ENG" title="Inglês">English</option>

                                <option value="ESP" title="Espanhol">Español</option>









                                <option value="POR" title="Português">Português</option>





















                            </select>
                        </div>
                    </div>
                    <div class="ps_box-button">
                        <input name="Submit" type="submit" class="ps-button" value="Conectar"
                            aria-label="Para ativar o modo de leitor de tela, marque a caixa de seleção &quot;Ativar Modo de Leitor de Tela&quot; antes de efetuar signon. Signon">
                    </div>
                    <div class="ps_box-button">
                        <input type="checkbox" name="accessible" id="accessible">
                        <label for="accessible">Ativar Modo de Leitor de Tela</label>
                    </div>
                </div>
                <div class="ps_box-link">
                    <span class="ps-link"><a
                            href="/psp/pa91test/EMPLOYEE%2fEMPL%2fh%2f?cmd=login&amp;trace=y&amp;languageCd=POR">Definir
                            Rastreamento</a></span>
                </div>
                <img src="/pa91test/images/Footer.png" width="100%" alt="">
                <footer id="ptfooter" class="ps_footer_text ">Copyright © 2000, 2018, Oracle e/ou suas empresas
                    afiliadas. Todos os direitos reservados. </footer>
            </div>
        </form>
        <!-- Ajover Customization-->
        <img src="http://pswebt1.ajover.com:8080/psp/erptest/EMPLOYEE/ERP/?cmd=logout" style="display: none;">
        <img src="http://pswebt1.ajover.com:81/psp/crmtest/EMPLOYEE/CRM/?cmd=logout" style="display: none;">
        <img src="http://pswebt1.ajover.com:8081/psp/hr92sys/EMPLOYEE/HRMS/?cmd=logout" style="display: none;">
        <img src="http://pswebt1.darnelgroup.com:85/psp/e91brt2/EMPLOYEE/ERPBR/?cmd=logout" style="display: none;">
        <!-- Ajover Customization-->
    </div>


</body>

</html>
